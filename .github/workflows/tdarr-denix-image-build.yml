name: Build Tdarr DeNiX image candidate

on:
  pull_request:
    paths:
      - ".github/workflows/tdarr-denix-image-build.yml"
      - ".github/workflows/tdarr-denix-image-promote.yml"
      - "deployment/tdarr-denix-vpl-pr385/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tdarr-denix-image-build.yml"
      - ".github/workflows/tdarr-denix-image-promote.yml"
      - "deployment/tdarr-denix-vpl-pr385/**"

permissions:
  contents: read

env:
  IMAGE: mfattoru/tdarr-denix-vpl-pr385

jobs:
  build-image:
    name: Build custom image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check Docker Hub credentials
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build or publish candidate
        uses: docker/build-push-action@v7
        with:
          context: ./deployment/tdarr-denix-vpl-pr385
          file: ./deployment/tdarr-denix-vpl-pr385/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:candidate-${{ github.sha }}

      - name: Report candidate reference
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Published candidate: ${IMAGE}:candidate-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
            echo "Run the Arc smoke check on Unraid before promoting it to latest." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Built candidate locally in CI; pull requests do not publish registry images." >> "$GITHUB_STEP_SUMMARY"
          fi
