name: Promote tested Tdarr DeNiX image

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Full candidate-<sha> tag, or the already verified pr385-20261111-smokecheck tag for initial setup
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: mfattoru/tdarr-denix-vpl-pr385

jobs:
  promote:
    name: Promote smoke-checked candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate smoke-checked source tag
        id: source
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          if [[ "$SOURCE_TAG" =~ ^candidate-([0-9a-f]{40})$ ]]; then
            candidate_sha="${BASH_REMATCH[1]}"
            git cat-file -e "${candidate_sha}^{commit}"
            if ! git merge-base --is-ancestor "$candidate_sha" origin/main; then
              echo "::error::Candidate commit must be reachable from main."
              exit 1
            fi
            release_tag="sha-${candidate_sha}"
          elif [[ "$SOURCE_TAG" == "pr385-20261111-smokecheck" ]]; then
            # Bootstrap latest from the already Arc-smoke-checked production image.
            release_tag=""
          else
            echo "::error::Use a candidate-<full-main-sha> tag, or the verified pr385-20261111-smokecheck tag for initial setup."
            exit 1
          fi
          echo "tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Confirm source exists
        env:
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
        run: docker buildx imagetools inspect "${IMAGE}:${SOURCE_TAG}"

      - name: Promote to immutable SHA tag and latest
        env:
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            docker buildx imagetools create \
              --tag "${IMAGE}:${RELEASE_TAG}" \
              --tag "${IMAGE}:latest" \
              "${IMAGE}:${SOURCE_TAG}"
          else
            docker buildx imagetools create \
              --tag "${IMAGE}:latest" \
              "${IMAGE}:${SOURCE_TAG}"
          fi

      - name: Report promoted tags
        env:
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          echo "Promoted ${IMAGE}:${SOURCE_TAG} to:" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "- ${IMAGE}:${RELEASE_TAG} (rollback tag)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Existing verified tag retained for rollback." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- ${IMAGE}:latest (Unraid update notification target)" >> "$GITHUB_STEP_SUMMARY"
